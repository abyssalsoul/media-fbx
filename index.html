<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Médiathèque Freebox</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="jellyfin-config.js"></script>
  <script src="films.js"></script>
  <script src="player.js"></script>
  <script src="app.js" defer></script>
  <link rel="stylesheet" href="films.css" />
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="#e2b714"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
  <div>
    <h1>Médiathèque Freebox</h1>
    <span id="counter">Chargement…</span>
    <span id="poster-status"></span>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="Rechercher…" />
  <button class="pill active" data-cat="all">Tout</button>
  <button class="pill" data-cat="film">Films</button>
  <button class="pill" data-cat="serie">Séries</button>
  <select id="sort">
    <option value="alpha">A → Z</option>
    <option value="year-desc">Année ↓</option>
    <option value="year-asc">Année ↑</option>
  </select>
</div>
<div id="status"></div>
<div id="grid"></div>

<div id="player-overlay">
  <div id="player-box">
    <div id="player-video-col">
      <div id="player-backdrop"></div>
      <button id="player-back" aria-label="Retour">←</button>
      <div id="player-loader"></div>
      <video id="player-video" controls></video>
      <div id="player-info">
        <span id="player-title"></span>
        <div id="player-nav">
          <button id="btn-prev">◀ Préc.</button>
          <button id="btn-next">Suiv. ▶</button>
        </div>
      </div>
    </div>
    <div id="player-playlist">
      <div id="player-playlist-header">
        <div id="player-playlist-title">Épisodes</div>
      </div>
      <div id="player-playlist-items"></div>
    </div>
  </div>
</div>
</body>
</html>
