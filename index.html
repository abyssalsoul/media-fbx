<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maupiflix</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/glslCanvas@0.2.6/dist/GlslCanvas.min.js"></script>
  <script src="jellyfin-config.js"></script>
  <script src="films.js"></script>
  <script src="player.js"></script>
  <script src="app.js" defer></script>
  <script src="fx-core.js" defer></script>
  <script src="fx-background.js" defer></script>
  <script src="fx-loader.js" defer></script>
  <script src="fx-cards.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/opendyslexic" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="films.css" />
</head>
<body>
<canvas id="fx-bg" aria-hidden="true"></canvas>
<canvas id="fx-card" aria-hidden="true"></canvas>
<header>
  <button id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel"><i class="ti ti-menu-2"></i></button>
  <h1>Maupiflix</h1>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Rechercher…" />
    <button id="search-clear" type="button" aria-label="Effacer la recherche" hidden>✕</button>
    <button id="search-mic" type="button" aria-label="Recherche vocale"><i class="ti ti-microphone"></i></button>
  </div>
</header>
<div id="menu-panel" hidden>
  <div id="menu-backdrop"></div>
  <nav id="menu-drawer" aria-label="Accessibilité">
    <div class="menu-head">
      <span>Accessibilité</span>
      <button id="menu-close" type="button" aria-label="Fermer le menu"><i class="ti ti-x"></i></button>
    </div>
    <label class="menu-row" for="opt-dyslexia">
      <span><i class="ti ti-letter-case"></i> Police dyslexie</span>
      <span class="switch"><input type="checkbox" id="opt-dyslexia"><span class="slider"></span></span>
    </label>
    <div class="menu-row">
      <span><i class="ti ti-text-size"></i> Taille du texte</span>
      <div class="fs-controls">
        <button id="fs-dec" type="button" aria-label="Réduire le texte">A−</button>
        <span id="fs-val">100%</span>
        <button id="fs-inc" type="button" aria-label="Agrandir le texte">A+</button>
      </div>
    </div>
    <label class="menu-row" for="opt-contrast">
      <span><i class="ti ti-contrast"></i> Contraste élevé</span>
      <span class="switch"><input type="checkbox" id="opt-contrast"><span class="slider"></span></span>
    </label>
    <div class="menu-theme">
      <span><i class="ti ti-palette"></i> Thème</span>
      <div class="menu-themes" id="menu-themes">
        <button class="theme-swatch" type="button" data-theme="gold" aria-label="Or"></button>
        <button class="theme-swatch" type="button" data-theme="red" aria-label="Rouge"></button>
        <button class="theme-swatch" type="button" data-theme="blue" aria-label="Bleu"></button>
        <button class="theme-swatch" type="button" data-theme="purple" aria-label="Violet"></button>
        <button class="theme-swatch" type="button" data-theme="green" aria-label="Vert"></button>
        <button class="theme-swatch" type="button" data-theme="pink" aria-label="Rose"></button>
      </div>
    </div>
    <label class="menu-row" for="opt-fx">
      <span><i class="ti ti-sparkles"></i> Effets visuels</span>
      <span class="switch"><input type="checkbox" id="opt-fx"><span class="slider"></span></span>
    </label>
  </nav>
</div>
<div class="genres" id="genres">
  <button class="genre active" data-genre="all" title="Tout" aria-label="Tout"><i class="ti ti-movie genre-ico"></i><span class="genre-label">Tout</span></button>
  <button class="genre" data-genre="animation" title="Animation" aria-label="Animation"><i class="ti ti-palette genre-ico"></i><span class="genre-label">Animation</span></button>
  <button class="genre" data-genre="famille" title="Famille" aria-label="Famille"><i class="ti ti-users genre-ico"></i><span class="genre-label">Famille</span></button>
  <button class="genre" data-genre="comedie" title="Comédie" aria-label="Comédie"><i class="ti ti-mood-smile genre-ico"></i><span class="genre-label">Comédie</span></button>
  <button class="genre" data-genre="fantastique" title="Fantastique" aria-label="Fantastique"><i class="ti ti-wand genre-ico"></i><span class="genre-label">Fantastique</span></button>
  <button class="genre" data-genre="action" title="Action" aria-label="Action"><i class="ti ti-bolt genre-ico"></i><span class="genre-label">Action</span></button>
  <button class="genre" data-genre="scifi" title="Science-fiction" aria-label="Science-fiction"><i class="ti ti-rocket genre-ico"></i><span class="genre-label">Sci-Fi</span></button>
  <button class="genre" data-genre="horreur" title="Horreur" aria-label="Horreur"><i class="ti ti-ghost genre-ico"></i><span class="genre-label">Horreur</span></button>
  <button class="genre" data-genre="romance" title="Amour" aria-label="Amour"><i class="ti ti-heart genre-ico"></i><span class="genre-label">Amour</span></button>
  <button class="genre" data-genre="series" title="Séries" aria-label="Séries"><i class="ti ti-device-tv genre-ico"></i><span class="genre-label">Séries</span></button>
</div>
<div id="status"></div>
<div id="grid"></div>

<div id="player-overlay">
  <div id="player-box">
    <div id="player-video-col">
      <div id="player-backdrop"></div>
      <button id="player-back" aria-label="Retour"><i class="ti ti-arrow-left"></i></button>
      <div id="player-loader"></div>
      <canvas id="fx-loader" aria-hidden="true"></canvas>
      <video id="player-video" controls></video>
      <div id="player-info">
        <span id="player-title"></span>
        <div id="player-nav">
          <button id="btn-episodes" aria-label="Épisodes" title="Épisodes"><i class="ti ti-list"></i></button>
          <button id="btn-prev" aria-label="Précédent" title="Précédent"><i class="ti ti-player-skip-back"></i></button>
          <button id="btn-next" aria-label="Suivant" title="Suivant"><i class="ti ti-player-skip-forward"></i></button>
        </div>
      </div>
    </div>
    <div id="player-playlist">
      <div id="player-playlist-header">
        <div id="player-playlist-title">Épisodes</div>
      </div>
      <div id="player-playlist-items"></div>
    </div>
  </div>
</div>
</body>
</html>
